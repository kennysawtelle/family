name: Daily Family Sports Refresh

on:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/family-sports-refresh.yml'
      - 'scripts/family-sports-ai-refresh.mjs'
      - 'scripts/family-sports-ai-refresh.test.mjs'
      - 'scripts/family-sports-refresh.mjs'

permissions:
  contents: write

concurrency:
  group: family-sports-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Research authoritative sources and apply verified changes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/family-sports-ai-refresh.mjs

      - name: Validate family sports data
        run: node scripts/family-sports-refresh.mjs

      - name: Run existing repository tests
        shell: bash
        run: |
          set -e
          for test in scripts/*.test.mjs; do
            echo "Running $test"
            node "$test"
          done

      - name: Guard changed paths
        shell: bash
        run: |
          set -e
          bad="$(git diff --name-only | grep -Ev '^(gracie\.html|gracie-2026\.ics|dane\.html|dane-2026\.ics|eli\.html|eli-2026-27\.ics|eli-football\.html|eli-football-2026\.ics|jack\.html|jack-2026\.ics|index\.html|family-schedule\.html|schedule-ui\.js|_worker\.js)$' || true)"
          if [ -n "$bad" ]; then
            echo "ERROR: updater changed forbidden paths:"
            echo "$bad"
            exit 1
          fi

      - name: Commit verified changes
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No verified schedule changes."
            exit 0
          fi
          git config user.name "Sawtelle Family Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- gracie.html gracie-2026.ics dane.html dane-2026.ics eli.html eli-2026-27.ics eli-football.html eli-football-2026.ics jack.html jack-2026.ics index.html family-schedule.html schedule-ui.js _worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Daily family sports refresh"
          git push origin HEAD:main
