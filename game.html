<style>:root{--navy:#10243a;--blue:#1677e8;--bg:#edf2f6;--card:#fff;--line:#d4dce5;--text:#172332}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(90deg,#071827,var(--navy));color:#fff;padding:18px}.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#fff;text-decoration:none;font-weight:700}.hero{max-width:1100px;margin:22px auto 0;padding:28px 18px;background:#fff;border-radius:16px;text-align:center;box-shadow:0 4px 14px #10243a1f}.hero h1{font-size:clamp(30px,7vw,58px);margin:8px 0}.team-brand-link,.game-brand-link{display:inline-block;padding:6px 10px;color:#fff3ce;background:#174d31;border:2px solid #c69339;border-radius:5px;font-weight:900;text-decoration:none}.team-brand-link:hover,.team-brand-link:focus-visible,.game-brand-link:hover,.game-brand-link:focus-visible{background:#0a2f1d;outline:2px solid #c12622;outline-offset:2px}.matchup-sep{display:inline-block;margin:0 8px;color:#8b5b25;font-size:.55em;font-weight:900;text-transform:uppercase}.records{font-size:clamp(20px,4vw,30px);font-weight:800}.meta{font-size:18px;line-height:1.55}.grid{max-width:1100px;margin:18px auto;padding:0 14px 30px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.card h2{margin-top:0}.watch a,.actions a{display:inline-block;margin:5px 8px 5px 0;padding:11px 14px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}.muted{color:#667085}.research{grid-column:1/-1}.research section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.research a{color:#145da0}.loading{font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.research{grid-column:auto}}.research-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.research-heading h2{margin:0}button{min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 14px;font-size:16px;font-weight:bold;color:var(--blue);cursor:pointer}button:disabled{opacity:.5}.research section a{display:block;font-size:18px;line-height:1.4;font-weight:bold}.research section p{font-size:14px;margin:7px 0}#checked{font-size:14px}[hidden]{display:none!important}.matchup-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;max-width:800px;margin:12px auto}.matchup-team{min-width:0}.hero .matchup-team h1{font-size:clamp(20px,5vw,40px);margin:0 0 8px}.matchup-team .team-brand-link{display:flex;align-items:center;justify-content:center;min-height:100px;width:100%;overflow-wrap:anywhere}.matchup-teams>.matchup-sep{font-size:16px;margin:40px 0 0}.matchup-team .records{font-size:20px}.record-date{font-size:12px;margin-top:4px}</style></head>
