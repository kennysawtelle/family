<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAA Division I Women’s Soccer Statistics</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#172332;font-family:Arial,sans-serif}header{background:#10243a;color:#fff;padding:16px}.top,main{max-width:1150px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px}.top a{color:#fff;font-weight:800;text-decoration:none}main{padding:16px 12px}.card,.table-wrap{background:#fff;border:1px solid #ccd6e0;border-radius:12px;margin-bottom:14px}.card{padding:16px}h1{font-size:clamp(1.45rem,5vw,2rem);margin:0 0 6px}p{margin:8px 0}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select{min-height:44px;max-width:100%;padding:8px;border-radius:8px;font:inherit}.table-wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:separate;border-spacing:0;min-width:680px}th,td{padding:10px;border-right:1px solid #d7dee7;border-bottom:1px solid #d7dee7;white-space:nowrap}th{position:sticky;top:0;z-index:2;background:#174d31;color:#fff;text-align:left;cursor:pointer}th:nth-child(2),td:nth-child(2){position:sticky;left:0}th:nth-child(2){z-index:3}td:nth-child(2){background:#fff}.mine td{background:#fff2c9;font-weight:800}.mine td:nth-child(2){background:#ffe7a0}.muted{color:#667085}a{color:#145da0}.error{color:#8a1538;font-weight:700}@media(max-width:650px){main{padding:12px 8px}.card{padding:12px}th,td{padding:9px 8px;font-size:.92rem}}</style></head><body><header><div class="top"><a href="standings.html?team=gracie">← Gracie standings</a><strong>NCAA Women’s Soccer</strong></div></header><main><section class="card"><h1>Division I team statistics</h1><p>Every team published by the NCAA. North Alabama is highlighted.</p><div class="controls"><label for="category"><strong>Statistic</strong></label><select id="category"></select></div><p class="muted" id="status">Loading current NCAA statistics…</p></section><div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><p><a id="source" href="https://www.ncaa.com/stats/soccer-women/d1" target="_blank" rel="noopener">Official NCAA source ↗</a></p></main><script>
const categories={'60':'Won-lost-tied percentage','56':'Scoring offense','58':'Goals-against average','1263':'Goal differential','59':'Shutout percentage','424':'Save percentage','94':'Assists per game','1176':'Corner kicks per game','547':'Fouls per game','1208':'Penalty kicks','95':'Points per game','551':'Red cards','93':'Saves per game','1203':'Shot accuracy','984':'Shots per game','986':'Shots on goal per game','910':'Total assists','914':'Total goals','915':'Total points','549':'Yellow cards'};for(const [v,l] of Object.entries(categories))category.add(new Option(l,v));category.value='60';let data,sortIndex=0,ascending=true;const number=v=>{if(String(v).trim()==='-')return null;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:null};function render(){[...head.children].forEach((th,i)=>th.textContent=th.dataset.label+(i===sortIndex?(ascending?' ▲':' ▼'):' ↕'));const rows=[...data.rows].sort((a,b)=>{const x=number(a[sortIndex]),y=number(b[sortIndex]);let c;if(x===null&&y!==null)c=1;else if(x!==null&&y===null)c=-1;else c=x!==null?x-y:String(a[sortIndex]).localeCompare(String(b[sortIndex]),undefined,{numeric:true});return ascending?c:-c});body.replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');if(r.some(v=>/^North (?:Alabama|Ala\.)$/i.test(v)))tr.className='mine';r.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});return tr}))}async function load(){status.className='muted';status.textContent='Loading current NCAA statistics…';head.replaceChildren();body.replaceChildren();try{const response=await fetch('/api/ncaa-wsoc?category='+category.value);const result=await response.json();if(!response.ok)throw Error(result.error||'Statistics unavailable.');data=result;result.headers.forEach((label,i)=>{const th=document.createElement('th');th.dataset.label=label;th.tabIndex=0;th.setAttribute('role','button');th.title='Sort by '+label;th.onclick=()=>{if(sortIndex===i)ascending=!ascending;else{sortIndex=i;ascending=i===0||/team/i.test(label)}render()};th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();th.click()}};head.append(th)});sortIndex=0;ascending=true;render();source.href=result.source;status.textContent=result.rows.length+' teams · Updated '+new Date(result.checkedAt).toLocaleString();}catch(error){status.className='error';status.textContent=error.message}}category.onchange=load;load();
</script></body></html>
