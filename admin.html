<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Sports Admin</title><meta name="robots" content="noindex,nofollow"><style>:root{--navy:#10243a;--blue:#1677e8;--red:#9b2435;--bg:#edf2f6;--line:#ccd7e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172332;font-family:Arial,Helvetica,sans-serif}header{background:var(--navy);color:#fff;padding:22px 16px}header div,main{max-width:760px;margin:auto}h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem)}header p{margin:6px 0 0}main{padding:18px 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 4px 14px #10243a18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:800}input,select,button{min-height:46px;border:1px solid #9baab8;border-radius:8px;padding:10px 12px;font:inherit}button{border:0;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.remove{background:var(--red)}.wide{grid-column:1/-1}.help{font-size:.9rem;color:#4c5a67;margin:4px 0 0}.status{margin:14px 0 0;padding:12px;border-left:5px solid var(--blue);background:#edf6ff;font-weight:700}.current{margin:0 0 16px;padding:12px;background:#f6f8fa;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}@media(max-width:580px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><div><h1>Family Sports Admin</h1><p>Set or clear a player’s injury status.</p></div></header><main><section class="panel"><p id="current" class="current">Choose a player to view the current setting.</p><form id="form" class="grid"><label class="wide">Administrator password<input id="password" type="password" autocomplete="current-password" required></label><label>Player<select id="calendar"><option value="gracie">Gracie — Soccer</option><option value="dane">Dane — Football</option><option value="eli-soccer">Eli — Soccer</option><option value="eli-football">Eli — Football</option><option value="jack">Jack Harn — Football</option></select></label><label>Injury starts<input id="start" type="date" required></label><label>Duration<select id="duration"><option value="season">Rest of season</option><option value="weeks">Number of weeks</option><option value="games">Number of games</option></select></label><label id="amountLabel" hidden>How many?<input id="amount" type="number" min="1" max="52" value="1"></label><p class="help wide">Only games on or after the start date and inside this duration will say the player is not playing. Canceled games are excluded.</p><div class="actions wide"><button type="submit">Save injury</button><button class="remove" id="clear" type="button">Clear injury</button></div></form><p id="status" class="status" role="status" hidden></p></section></main><script>const $=id=>document.getElementById(id);let injuries={};const names={gracie:'Gracie',dane:'Dane','eli-soccer':'Eli soccer','eli-football':'Eli football',jack:'Jack Harn'};const today=new Date().toISOString().slice(0,10);$('start').value=today;async function load(){const r=await fetch('/api/injuries',{cache:'no-store'});injuries=(await r.json()).injuries||{};show()}function show(){const i=injuries[$('calendar').value];$('current').textContent=i?.injured?`${names[$('calendar').value]}: injured from ${i.startDate} through ${i.throughDate} (${i.durationType==='season'?'rest of season':i.durationValue+' '+i.durationType}).`:`${names[$('calendar').value]}: no active injury setting.`}function message(text,error=false){$('status').hidden=false;$('status').textContent=text;$('status').style.borderColor=error?'#9b2435':'#1677e8'}$('duration').onchange=()=>{$('amountLabel').hidden=$('duration').value==='season'};$('calendar').onchange=show;async function save(injured){message('Saving…');const r=await fetch('/api/injuries',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':$('password').value},body:JSON.stringify({calendar:$('calendar').value,injured,startDate:$('start').value,durationType:$('duration').value,durationValue:Number($('amount').value)})});const data=await r.json();if(!r.ok){message(data.error||'Could not save.',true);return}await load();message(injured?'Injury saved. The site and calendar feeds are updated.':'Injury cleared. The site and calendar feeds are updated.')}$('form').onsubmit=e=>{e.preventDefault();save(true)};$('clear').onclick=()=>save(false);load().catch(()=>message('Could not load injury settings.',true));</script></body></html>
