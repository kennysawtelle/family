<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Family Games — Sawtelle Family Sports</title><meta name="description" content="One combined schedule for every Sawtelle family athlete."><meta property="og:title" content="All Family Games — Sawtelle Family Sports"><meta property="og:description" content="The complete combined family athlete schedule."><meta property="og:image" content="https://family.kensawtelle.com/sawtelle-family-sports-preview.jpg"><style>:root{--navy:#10243a;--navy2:#071827;--green:#174d31;--gold:#d2a445;--cream:#fff4cf;--paper:#f8dfaa;--red:#a82336;--line:#b98942}*{box-sizing:border-box}body{margin:0;background:#efe1ba;color:#201a14;font-family:Arial,Helvetica,sans-serif}header{background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;padding:14px}.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;justify-content:space-between}.top a{color:#fff;font-weight:800;text-decoration:none;padding:10px 0}.top strong{font-family:Georgia,serif;font-size:1.25rem}.intro{max-width:1100px;margin:18px auto 0;padding:0 12px}.hero{background:#ae211d;color:#fff8dc;border:4px solid var(--gold);padding:22px 24px}.hero p{margin:0 0 10px;text-transform:uppercase;letter-spacing:.15em}.hero h1{font:700 clamp(2rem,7vw,3.5rem)/1 Georgia,serif;margin:0}.hero .range{margin:12px 0 0;font-size:1rem;letter-spacing:.08em}.filters{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.filters button{min-height:44px;padding:10px 16px;border:2px solid var(--green);background:#fff5d5;color:var(--green);border-radius:8px;font-weight:900;font-size:1rem}.filters button.active{background:var(--green);color:#fff}.schedule{max-width:1100px;margin:0 auto;padding:0 12px 30px}.day{margin:18px 0;border:2px solid var(--line);background:#f2d99f;padding-bottom:4px;box-shadow:0 3px 8px #4b321526}.day h2{margin:0;background:#92531a;color:#fff8dc;padding:12px 16px;font:700 clamp(1.15rem,4vw,1.6rem) Georgia,serif;text-transform:uppercase;letter-spacing:.05em}.game{display:grid;grid-template-columns:minmax(120px,.65fr) minmax(170px,.9fr) minmax(220px,1.45fr);margin:10px;background:#fff9e5;border:1px solid #cfad6e;border-left:8px solid var(--athlete-color,#174d31);border-radius:8px;overflow:hidden;min-height:94px;box-shadow:0 2px 5px #563a1820}.game>div,.game>a{padding:14px;border-right:1px solid #cda35f;display:flex;flex-direction:column;justify-content:center}.game>*:last-child{border-right:0}.time{font-weight:900;font-size:1.05rem}.time small{font-weight:500;color:#6c5944;margin-top:4px}.athlete{font-weight:900;color:var(--green)}.athlete small{font-weight:600;color:#604d37;margin-top:5px}.match{color:inherit;text-decoration:none;font-weight:900}.match span{font-weight:500;color:#5e4c39;margin-top:6px}.injured{display:inline-block;margin-top:7px;background:#fff0f1;color:#7d1726;border-left:4px solid var(--red);padding:6px 8px;font-size:.85rem;font-weight:900}.injury-summary{margin:12px 0;background:#fff0f1;color:#681521;border:2px solid #a82336;border-radius:9px;padding:14px 16px}.injury-summary h2{margin:0 0 5px;font:700 1.2rem Georgia,serif}.injury-summary p{margin:0;line-height:1.45}.empty,.error{background:#fff5d5;border:2px solid var(--line);padding:20px;font-weight:800}.loading{padding:30px;text-align:center;font-weight:800}@media(max-width:680px){.top{align-items:flex-start}.game{grid-template-columns:1fr 1fr;margin:10px 8px}.match{grid-column:1/-1;border-top:1px solid #cda35f!important}.game>div,.game>a{border-right:0;padding:12px}.time{border-right:1px solid #cda35f!important}.hero{padding:18px}.day h2{font-size:1.1rem;padding:11px 14px}}</style></head><body><header><div class="top"><a href="index.html">← Family Sports</a><strong>All Family Games</strong></div></header><section class="intro"><div class="hero"><p>Complete family athlete schedule</p><h1>All Games</h1><p class="range" id="range">Loading the full season…</p></div><div class="filters" aria-label="Schedule range"><button class="active" data-view="upcoming">Upcoming season</button><button data-view="all">All games</button></div><section class="injury-summary" id="injurySummary" hidden></section></section><main class="schedule" id="schedule"><p class="loading">Combining every family schedule…</p></main><script src="schedule-time.js?v=20260924"></script><script>const athletes=[{key:'gracie',name:'Gracie',sport:'UNA Women’s Soccer',file:'gracie-2026.ics',page:'gracie.html',record:'3–1–3',color:'#4f2d86'},{key:'dane',name:'Dane',sport:'Bonita Varsity Football',file:'dane-2026.ics',page:'dane.html',record:'5–0–0',color:'#06244a'},{key:'eli-soccer',name:'Eli',sport:'Los Gatos United Soccer',file:'eli-2026-27.ics',page:'eli.html',record:'1–2–1',color:'#0b6b3a'},{key:'eli-football',name:'Eli',sport:'Santa Cruz Varsity Football',file:'eli-football-2026.ics',page:'eli-football.html',record:'3–1–0',color:'#b51f2e'},{key:'jack',name:'Jack Harn',sport:'Soquel JV Football',file:'jack-2026.ics',page:'jack.html',record:'2–1–0',color:'#0a2f6b'}];let games=[],view='upcoming';const today=ScheduleTime.parts(new Date(),ScheduleTime.pacific).slice(0,10);const fmtDate=date=>new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));const cleanSummary=(summary,name)=>summary.replace(`(Not playing — ${name} is injured)`,'').replace(new RegExp('^'+name.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s+[—-]\\s+'),'').trim();const opponentFor=g=>cleanSummary(g.summary,g.athlete.name).replace(/^.*?\s(?:vs\.?|at|—)\s+/i,'').replace(/\s+\(Time TBA\)$/i,'').trim();const opponentRecords={'West Georgia':'0–5–2'};const gameHref=g=>{const matchup=cleanSummary(g.summary,g.athlete.name);const description=g.description||'';const final=(description.match(/Final:\s*([^.]*)/i)||[])[1]||'';const stream=(description.match(/Watch:\s*([^—.]+)/i)||[])[1]?.trim()||'TBD';const params=new URLSearchParams({team:g.athlete.name,opponent:opponentFor(g),ha:/\sat\s/i.test(matchup)?'Away':'Home',date:g.dateKey,uid:g.uid,calendar:g.athlete.file,time:g.start?`${g.times.Pacific} / ${g.times.Eastern}`:'Time TBD',venue:g.location||'Location TBD',stream,record:g.athlete.record||'Record TBD',oppRecord:opponentRecords[opponentFor(g)]||'Record TBD',sport:g.athlete.sport,status:g.status==='CANCELLED'?'Canceled':final?`Final: ${final}`:'Scheduled',completed:g.status==='CANCELLED'||g.dateKey<today?'1':'0',teamPage:g.athlete.page,share:'2'});return'game.html?'+params.toString();};function render(){const shown=(view==='upcoming'?games.filter(g=>g.dateKey>=today&&g.status!=='CANCELLED'):games).sort((a,b)=>(a.start?.getTime()||Date.parse(a.dateKey))-(b.start?.getTime()||Date.parse(b.dateKey)));const root=document.getElementById('schedule');if(!shown.length){root.innerHTML='<p class="empty">No games are listed for this range.</p>';return}const groups=new Map();shown.forEach(game=>groups.set(game.dateKey,[...(groups.get(game.dateKey)||[]),game]));root.innerHTML=[...groups].map(([date,items])=>`<section class="day"><h2>${fmtDate(date)}</h2>${items.map(g=>`<article class="game" style="--athlete-color:${g.athlete.color}"><div class="time">${g.start?g.times.Pacific:'Time TBD'}<small>${g.status==='CANCELLED'?'Canceled':'Scheduled'}</small></div><div class="athlete">${g.athlete.name}<small>${g.athlete.sport}</small></div><a class="match" href="${gameHref(g)}">${cleanSummary(g.summary,g.athlete.name)}<span>${g.location||'Location TBD'}</span>${/Not playing/.test(g.summary)?`<em class="injured">Not playing — ${g.athlete.name} is injured</em>`:''}</a></article>`).join('')}</section>`).join('');const injured=shown.filter(g=>/Not playing/.test(g.summary));const injuryBox=document.getElementById('injurySummary');if(injured.length){const first=injured[0],last=injured.at(-1);injuryBox.hidden=false;injuryBox.innerHTML=`<h2>${first.athlete.name} injury timeline</h2><p><strong>${fmtDate(first.dateKey)} through ${fmtDate(last.dateKey)}</strong> · ${injured.length} affected game${injured.length===1?'':'s'} · Not playing</p>`;}else injuryBox.hidden=true;document.getElementById('range').textContent=view==='upcoming'?`${shown.length} upcoming games through ${new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(shown.at(-1).dateKey+'T12:00:00Z'))}`:`${shown.length} games across the complete published schedules`;}Promise.all(athletes.map(async athlete=>{const response=await fetch(athlete.file,{cache:'no-store'});if(!response.ok)throw new Error(athlete.name);return ScheduleTime.parse(await response.text()).filter(event=>event.dateKey).map(event=>({...event,athlete}));})).then(results=>{games=results.flat();render()}).catch(()=>{document.getElementById('schedule').innerHTML='<p class="error">The combined schedule could not load. Individual athlete schedule pages are still available from the home page.</p>'});document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));render()});</script></body></html>
